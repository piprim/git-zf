[[commit-types]]
name = "feat"
desc = "A new feature"

[[commit-types]]
name = "fix"
desc = "A bug fix"

[[commit-types]]
name = "docs"
desc = "Documentation only changes"

[[commit-types]]
name = "style"
desc = "Changes that do not affect the meaning of the code"

[[commit-types]]
name = "refactor"
desc = "A code change that neither fixes a bug nor adds a feature"

[[commit-types]]
name = "perf"
desc = "A code change that improves performance"

[[commit-types]]
name = "test"
desc = "Adding missing tests"

[[commit-types]]
name = "chore"
desc = "Changes to the build process or auxiliary tools"

[[commit-types]]
name = "revert"
desc = "Revert to a commit"

[[commit-types]]
name = "WIP"
desc = "Work in progress"

[commit-message]
template = "{{.type}}{{with .scope}}({{.}}){{end}}: {{.subject}}{{with .body}}\n\n{{.}}{{end}}{{with .footer}}\n\n{{.}}{{end}}"
ref-format = "Refs #%s"
close-format = "Closes #%s"

[[commit-message.items]]
name = "scope"
desc = "Scope (users, db, poll…):"
form = "input"

[[commit-message.items]]
name = "subject"
desc = "Concise description. Imperative, lower case, no final dot:"
form = "input"
required = true

[[commit-message.items]]
name = "body"
desc = "Motivation for the change and contrast with previous behaviour:"
form = "multiline"

[[commit-message.items]]
name = "footer"
desc = "Breaking changes and referenced issues:"
form = "multiline"

[branch]
base = ""
remote = ""

[issue-tracker]
type = ""
url = ""
token = ""
mirror = false

[push]
propose = true

[review]
require-signed = false

# `git zf log`: the commands of the view. 1-9 switch to the command with that
# key, c picks one by name. A command must start every line with the hash
# (after the graph characters) for enter to open the commit. A `[[log.cmds]]`
# array in a user file replaces this whole list.
[log]
default-cmd = "graph"

[[log.cmds]]
name = "graph"
description = "every branch and tag as a graph"
key = 1
cmd = "git log --exclude='*zf/*' --graph --oneline --all --decorate --pretty=tformat:'%Cred%h%Creset -%C(yellow)%d%Creset %s %Cgreen%cd (%cr) %C(bold blue)<%an by %cn>%Creset' --abbrev-commit --date=iso --date-order"

[[log.cmds]]
name = "branch"
description = "the current branch and what was merged into it"
key = 2
cmd = "git log --exclude='*zf/*' --graph --oneline --decorate --pretty=tformat:'%Cred%h%Creset -%C(yellow)%d%Creset %s %Cgreen(%cr)%Creset %C(bold blue)<%an>%Creset' --abbrev-commit --date-order"

[[log.cmds]]
name = "linear"
description = "a flat list of every commit but the merges, across branches"
key = 3
cmd = "git log --exclude='*zf/*' --all --no-merges --oneline --decorate --pretty=tformat:'%Cred%h%Creset -%C(yellow)%d%Creset %s %Cgreen(%cr)%Creset %C(bold blue)<%an>%Creset' --abbrev-commit --date-order"

[[log.cmds]]
name = "first-parent"
description = "the current branch one line per merged feature"
key = 4
cmd = "git log --first-parent --oneline --decorate --pretty=tformat:'%Cred%h%Creset -%C(yellow)%d%Creset %s %Cgreen(%cr)%Creset %C(bold blue)<%an>%Creset' --abbrev-commit"

[[log.cmds]]
name = "recent"
description = "what moved in the last two weeks, across branches"
key = 5
cmd = "git log --exclude='*zf/*' --graph --oneline --all --decorate --since='2 weeks ago' --pretty=tformat:'%Cred%h%Creset -%C(yellow)%d%Creset %s %Cgreen%cd (%cr) %C(bold blue)<%an by %cn>%Creset' --abbrev-commit --date=iso --date-order"

[[log.cmds]]
name = "tags"
description = "tagged commits only"
key = 6
cmd = "git log --no-walk --tags --oneline --decorate --pretty=tformat:'%Cred%h%Creset -%C(yellow)%d%Creset %s %Cgreen(%cr)%Creset %C(bold blue)<%an>%Creset' --abbrev-commit"
