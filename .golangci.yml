# .golangci.yml
version: "2"
run:
  go: "1.24"
  issues-exit-code: 1
  tests: false
  allow-parallel-runners: true
linters:
  default: none
  enable:
    - prealloc
    - copyloopvar
    - gocognit
    - depguard
    - dogsled
    - dupl
    - errcheck
    - funlen
    - gochecknoinits
    - goconst
    - gocritic
    - gocyclo
    - nestif
    - goprintffuncname
    - gosec
    - govet
    - ineffassign
    - mnd
    - nakedret
    - nlreturn
    - noctx
    - nolintlint
    - revive
    - recvcheck
    - sloglint
    - staticcheck
    - unconvert
    - unparam
    - unused
    - whitespace
    - wrapcheck
    - protogetter
  settings:
    recvcheck:
      # Disables the built-in method exclusions:
      # - `MarshalText`
      # - `MarshalJSON`
      # - `MarshalYAML`
      # - `MarshalXML`
      # - `MarshalBinary`
      # - `GobEncode`
      # Default: false
      disable-builtin: true
      # User-defined method exclusions.
      # The format is `struct_name.method_name` (ex: `Foo.MethodName`).
      # A wildcard `*` can use as a struct name (ex: `*.MethodName`).
      # Default: []
      exclusions:
        - "*.Value"
        - "*.String"
        - "*.Scan" ## Code generated by go-enum
        - "*.AppendText" ## Code generated by go-enum
        - "*.UnmarshalText"
    prealloc:
      # IMPORTANT: we don't recommend using this linter before doing performance profiling.
      # For most programs usage of prealloc will be a premature optimization.

      # Report pre-allocation suggestions only on simple loops that have no returns/breaks/continues/gotos in them.
      # Default: true
      simple: false
      # Report pre-allocation suggestions on range loops.
      # Default: true
      range-loops: false
      # Report pre-allocation suggestions on for loops.
      # Default: false
      for-loops: true
    nestif:
      # Minimal complexity of if statements to report.
      # Default: 5
      min-complexity: 5
    sloglint:
      # Enforce not mixing key-value pairs and attributes.
      # Default: true
      no-mixed-args: false
      # Enforce using key-value pairs only (overrides no-mixed-args, incompatible with attr-only).
      # Default: false
      kv-only: true
      # Enforce using attributes only (overrides no-mixed-args, incompatible with kv-only).
      # Default: false
      attr-only: false
      # Enforce using static values for log messages.
      # Default: false
      static-msg: false
      # Enforce using constants instead of raw keys.
      # Default: false
      no-raw-keys: false
      # Enforce a single key naming convention.
      # Values: snake, kebab, camel, pascal
      # Default: ""
      key-naming-case: snake
      # Enforce putting arguments on separate lines.
      # Default: false
      args-on-sep-lines: false
    copyloopvar:
      check-alias: true
    cyclop:
      max-complexity: 10
      package-average: 0.5
    decorder:
      dec-order:
        - type
        - const
        - var
        - func
    depguard:
      rules:
        logger:
          deny:
            - pkg: github.com/sirupsen/logrus
              desc: logging is allowed only by log/slog
            - pkg: github.com/uber-go/zap
              desc: logging is allowed only by log/slog
    dupl:
      threshold: 100
    funlen:
      lines: -1
      statements: 70
    goconst:
      min-len: 2
      min-occurrences: 3
    gocritic:
      disabled-checks:
        - dupImport
        - ifElseChain
        - octalLiteral
        - whyNoLint
        - commentedOutCode
      enabled-tags:
        - diagnostic
        - experimental
        - opinionated
        - performance
        - style
    gocyclo:
      min-complexity: 20
    gosec:
      excludes:
        - G115
    govet:
      disable:
        - sigchanyzer
        - structtag
      settings:
        printf:
          funcs:
            - (github.com/golangci/golangci-lint/pkg/logutils.Log).Infof
            - (github.com/golangci/golangci-lint/pkg/logutils.Log).Warnf
            - (github.com/golangci/golangci-lint/pkg/logutils.Log).Errorf
            - (github.com/golangci/golangci-lint/pkg/logutils.Log).Fatalf
    lll:
      line-length: 124
    mnd:
      checks:
        - argument
        - case
        - condition
        - operation
        - return
        - assign
      ignored-numbers:
        - "0666"
        - "0600"
        - "0644"
        - "0755"
        - "0777"
        - "0700"
        - "0o666"
        - "0o600"
        - "0o644"
        - "0o755"
        - "0o777"
        - "0o700"
        - "42"
        - "1"
        - "2"
        - "3"
        - "4"
        - "5"
        - "8"
        - "16"
        - "32"
      ignored-files:
        - magic1_.+\.go$
      ignored-functions:
        - ^math\.
        - ^http\.StatusText$
    nlreturn:
      block-size: 2
    nolintlint:
      require-explanation: true
      require-specific: true
      allow-unused: false
    revive:
      max-open-files: 2048
      severity: warning
      enable-all-rules: true
      enable-default-rules: true
      directives:
        - name: specify-disable-reason
          severity: error
      confidence: 0.1
      rules:
        - name: add-constant
          disabled: true # Already checked
          arguments:
            - max-lit-count: "3"
              allow-strs: '""'
              allow-ints: "0,1,2"
              allow-floats: "0.0,0.,1.0,1.,2.0,2."
        - name: argument-limit
          arguments: [5]
        - name: banned-characters
          arguments: ["7"]
        - name: cognitive-complexity
          arguments: [20]
        - name: comment-spacings
          arguments:
            - mypragma
            - otherpragma
        - name: comments-density
          disabled: true
          arguments: [15]
        - name: context-as-argument
          arguments:
            - allow-types-before: "*testing.T,*github.com/user/repo/testing.Harness"
        - name: cyclomatic
          arguments: [20]
        - name: defer
          arguments:
            [
              [
                "call-chain",
                "loop",
                "method-call",
                "recover",
                "immediate-recover",
                "return",
              ],
            ]
        - name: dot-imports
          arguments:
            - allowed-packages:
                ["github.com/onsi/ginkgo/v2", "github.com/onsi/gomega"]
        - name: early-return
          arguments:
            - "preserve-scope"
            - "allow-jump"
        - name: enforce-map-style
          arguments:
            - "make"
        - name: enforce-repeated-arg-type-style
          arguments:
            - "short"
            # Or this parameter:
            - func-arg-style: "full"
              func-ret-val-style: "short"
        - name: enforce-slice-style
          arguments:
            - "any"
        - name: enforce-switch-style
          arguments: ["allowNoDefault"]
        - name: error-strings
          arguments:
            - "xerrors.New"
        - name: exported
          arguments:
            - "check-private-receivers"
            - "disable-stuttering-check"
            - "say-repetitive-instead-of-stutters"
            - "check-public-interface"
            - "disable-checks-on-constants"
            - "disable-checks-on-functions"
            - "disable-checks-on-methods"
            - "disable-checks-on-types"
            - "disable-checks-on-variables"
        - name: file-header
          disabled: true
          arguments:
            - This is the text that must appear at the top of source files.
        - name: file-length-limit
          arguments:
            - max: 500
              skip-comments: true
              skip-blank-lines: true
        - name: filename-format
          exclude: ["**/migrations/**/*.go"]
          arguments:
            - "^[_a-z][_a-z0-9]*\\.go$"
        - name: flag-parameter
          disabled: true
        - name: function-length
          arguments: [70, 170]
        - name: function-result-limit
          arguments: [3]
        - name: import-alias-naming
          arguments:
            - "^[a-z][a-z0-9]{0,}$"
            # Or this parameter:
            - allow-regex: "^[a-z][a-z0-9]{0,}$"
              deny-regex: '^v\d+$'
        - name: imports-blocklist
          arguments:
            - "crypto/md5"
            - "crypto/sha1"
        - name: indent-error-flow
          arguments:
            - "preserve-scope"
        - name: line-length-limit
          arguments: [124]
        - name: max-control-nesting
          arguments: [3]
        - name: max-public-structs
          arguments: [10]
        - name: package-directory-mismatch
          exclude: ["**/migrations/**/*.go"]
          arguments:
            - ignore-directories: ["testcases", "testinfo"]
        - name: package-naming
          arguments:
            - skip-convention-name-check: true
              # convention-name-check-regex: '^[a-z][a-zA-Z0-9]*$'
              skip-top-level-check: true
              skip-default-bad-name-check: true
              check-extra-bad-name: true
              user-defined-bad-names:
                - foo
                - bar
              skip-collision-with-common-std: true
              check-collision-with-all-std: false
        - name: receiver-naming
          arguments:
            - max-length: 2
        - name: string-format
          arguments:
            - - "core.WriteError[1].Message"
              - "/^([^A-Z]|$)/"
              - must not start with a capital letter
            - - "fmt.Errorf[0]"
              - '/(^|[^\.!?])$/'
              - must not end in punctuation
            - - panic
              - '/^[^\n]*$/'
              - must not contain line breaks
        - name: struct-tag
          arguments:
            - "!validate"
            - "json,inline"
            - "bson,outline,gnu"
        - name: superfluous-else
          arguments:
            - "preserve-scope"
        - name: unchecked-type-assertion
          arguments:
            - accept-ignored-assertion-result: true
        - name: unhandled-error
          arguments:
            - "^fmt.Printf"
            - "^fmt.Println"
            - "^fmt.Fprint"
            - "^fmt.Fprintln"
            - "^fmt.Fprintf"
        - name: unused-parameter
          arguments:
            - allow-regex: "^_"
        - name: unused-receiver
          arguments:
            - allow-regex: "^_"
        - name: var-naming
          arguments:
            - ["ID"] # AllowList
            - ["VM"] # DenyList
            - - skip-initialism-name-checks: true
                upper-case-const: true
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      # - linters:
      #   - revive
      # text: 'package-directory-mismatch'
      # path: '/domain/'
      - linters:
          - wrapcheck
        text: 'eris\.New\('
      - path: pkg/golinters/errcheck.go
        text: "SA1019: errCfg.Exclude is deprecated: use ExcludeFunctions instead"
      - path: pkg/commands/run.go
        text: "SA1019: lsc.Errcheck.Exclude is deprecated: use ExcludeFunctions instead"
      - path: pkg/commands/run.go
        text: "SA1019: e.cfg.Run.Deadline is deprecated: Deadline exists for historical compatibility and should not be used."
      - path: pkg/golinters/gofumpt.go
        text: "SA1019: settings.LangVersion is deprecated: use the global `run.go` instead."
      - path: pkg/golinters/staticcheck_common.go
        text: "SA1019: settings.GoVersion is deprecated: use the global `run.go` instead."
      - path: pkg/lint/lintersdb/manager.go
        text: "SA1019: (.+).(GoVersion|LangVersion) is deprecated: use the global `run.go` instead."
      - path: pkg/golinters/unused.go
        text: 'rangeValCopy: each iteration copies 160 bytes \(consider pointers or indexing\)'
      - path: test/(fix|linters)_test.go
        text: string `gocritic.go` has 3 occurrences, make it a constant
      - linters:
          - cyclop
        path: (.+)_test\.go
    paths:
      - etc/
      - test/testdata_etc/
      - app/gmodels/
      - app/gdal/
      - internal/cache/
      - internal/renameio/
      - internal/robustio/
      - third_party$
      - builtin$
      - examples$
formatters:
  enable:
    - gofmt
    - goimports
  settings:
    gofmt:
      rewrite-rules:
        - pattern: interface{}
          replacement: any
        - pattern: a[b:len(a)]
          replacement: a[b:]
    goimports:
      local-prefixes:
        - github.com/golangci/golangci-lint
  exclusions:
    generated: lax
    paths:
      - etc/
      - test/testdata_etc/
      - app/gmodels/
      - app/gdal/
      - internal/cache/
      - internal/renameio/
      - internal/robustio/
      - third_party$
      - builtin$
      - examples$
